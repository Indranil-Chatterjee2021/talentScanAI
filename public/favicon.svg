<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="16" cy="16" r="15" fill="url(#grad)" stroke="#fff" stroke-width="1"/>
  
  <!-- Target rings -->
  <circle cx="16" cy="16" r="12" fill="none" stroke="#fff" stroke-width="1.5"/>
  <circle cx="16" cy="16" r="9" fill="none" stroke="#fff" stroke-width="1.2"/>
  <circle cx="16" cy="16" r="6" fill="none" stroke="#fff" stroke-width="1"/>
  <circle cx="16" cy="16" r="3" fill="#fff"/>
  
  <!-- Bullseye -->
  <circle cx="16" cy="16" r="1.5" fill="url(#grad)"/>
</svg>